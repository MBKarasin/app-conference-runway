name: Check sources and publish

on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC = 2 a.m. EDT / 1 a.m. EST. GitHub may start scheduled runs hours late; the check runs whenever it starts.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}                  # nothing by default; each job asks for only what it needs

concurrency:
  group: runway
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      go: ${{ steps.gate.outputs.go }}
    permissions:
      contents: write            # commit the verification stamps (also keeps the schedule alive)
      issues: write              # open/refresh the review digest
    steps:
      - name: Run the check (no clock gate; a late scheduled start must still run)
        id: gate
        run: echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: true }
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.go == 'true'
        run: pip install --no-cache-dir "pypdf==5.*"
      - if: steps.gate.outputs.go == 'true'
        name: Second readers (headless Chromium for JavaScript-only pages, OCR for organizer images)
        # 2026-09-24: optional. If this install fails, check.py keeps its plain reader and the run continues.
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install --no-cache-dir "playwright==1.*" "pillow==11.*"
          python -m playwright install --with-deps chromium
      - if: steps.gate.outputs.go == 'true'
        run: python scripts/build.py
      - if: steps.gate.outputs.go == 'true'
        name: Check sources, links and data
        id: check
        continue-on-error: true
        run: python scripts/check.py && python scripts/linkcheck.py && python scripts/build.py && python scripts/validate.py
      - if: steps.gate.outputs.go == 'true'
        name: Daily archive (runs even if the check failed)
        run: python scripts/snapshot.py
      - if: steps.gate.outputs.go == 'true'
        name: Commit verification stamps
        run: |
          git config user.name "runway-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json data/check_report.md data/link_report.md data/link_status.json data/ledger.json data/snapshots site/data/runway.json site/runway.ics
          git diff --cached --quiet || git commit -m "Nightly source check $(date -u +%F)"
          git push
      - if: steps.gate.outputs.go == 'true'
        name: Review digest
        # 2026-09-24: a GitHub API hiccup here must not fail the job and block a deploy whose data already validated.
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The issue is always rewritten from the report committed in this run, so the two can never disagree.
          open_items=$(grep -oE "^OPEN_ITEMS=[0-9]+" data/check_report.md | cut -d= -f2)
          gh label create source-check --color E0A21A --force >/dev/null
          n=$(gh issue list --label source-check --state all --limit 1 --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file data/check_report.md
          else gh issue create --title "Runway: dates to review" --label source-check --body-file data/check_report.md; n=""; fi
          if [ -n "$n" ]; then
            if [ "${open_items:-1}" = "0" ]; then gh issue close "$n" --reason completed || true; else gh issue reopen "$n" || true; fi
          fi
      - if: steps.check.outcome == 'failure'
        name: Fail the run if the check or validation failed (after archiving and reporting)
        run: exit 1

  deploy:
    needs: [check]
    if: always() && (needs.check.result == 'skipped' || (needs.check.result == 'success' && needs.check.outputs.go == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - run: python scripts/build.py && python scripts/validate.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
