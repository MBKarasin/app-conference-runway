name: Check sources and publish

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York" # 4 a.m. Eastern, including DST; delayed starts still run.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}                  # nothing by default; each job asks for only what it needs

concurrency:
  group: runway
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      go: ${{ steps.gate.outputs.go }}
    permissions:
      contents: write            # commit the verification stamps (also keeps the schedule alive)
      issues: write              # open/refresh the review digest
    steps:
      - name: Run the check (no clock gate; a late scheduled start must still run)
        id: gate
        run: |
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: true }
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.go == 'true'
        run: pip install --no-cache-dir "pypdf==5.*"
      - if: steps.gate.outputs.go == 'true'
        name: Second readers (headless Chromium for JavaScript-only pages, OCR for organizer images)
        id: readers
        # 2026-09-24: optional. If this install fails, check.py keeps its plain reader and the run continues.
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install --no-cache-dir "playwright==1.*" "pillow==11.*"
          python -m playwright install --with-deps chromium
      - if: steps.gate.outputs.go == 'true'
        name: Curated data regression checks
        run: python -m unittest discover -s tests
      - name: Daily status regression checks
        run: node tests/test_daily_status.js
      - if: steps.gate.outputs.go == 'true'
        run: python scripts/build.py
      - if: steps.gate.outputs.go == 'true'
        name: Read organizer sources (advisory)
        id: sources
        continue-on-error: true
        run: python scripts/check.py
      - if: steps.gate.outputs.go == 'true'
        name: Read outbound links (advisory)
        id: links
        continue-on-error: true
        run: python scripts/linkcheck.py
      - if: steps.gate.outputs.go == 'true'
        name: Build and validate candidate
        id: validate
        continue-on-error: true
        run: python scripts/build.py && python scripts/validate.py
      - if: always() && steps.gate.outputs.go == 'true'
        name: Daily archive (also retain failed-candidate evidence)
        run: python scripts/snapshot.py
      - if: always() && steps.gate.outputs.go == 'true'
        name: Record candidate status (publication receipt is separate)
        env:
          VALIDATE_OUTCOME: "${{ steps.validate.outcome }}"
          SOURCES_OUTCOME: "${{ steps.sources.outcome }}"
          LINKS_OUTCOME: "${{ steps.links.outcome }}"
          READERS_OUTCOME: "${{ steps.readers.outcome }}"
        run: |
          python - <<'PY'
          import json, os, datetime as dt
          from pathlib import Path
          now = dt.datetime.now(dt.UTC).strftime("%Y-%m-%dT%H:%M:%SZ")
          d = json.load(open("site/data/runway.json", encoding="utf-8"))
          ok = os.environ["VALIDATE_OUTCOME"] == "success"
          readers_ok = all(os.environ[k] == "success" for k in ("SOURCES_OUTCOME", "LINKS_OUTCOME"))
          status = {"schedule": "04:00 America/New_York (GitHub Actions)",
                    "status": ("success" if readers_ok else "issues") if ok else "failure", "started_at": os.environ["RUN_STARTED"],
                    "completed_at": now, "sources_checked_at": d.get("sources_checked"),
                    "published_at": None,
                    "outcomes": {k: os.environ[k.upper() + "_OUTCOME"] for k in ("validate", "sources", "links", "readers")}}
          Path("data/run-status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          # Preserve the previous live stamp when validation failed.
          if ok:
              Path("site/data/update-status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY
      - if: always() && steps.gate.outputs.go == 'true'
        name: Commit reports; commit candidate only after validation
        env: { VALIDATE_OUTCOME: "${{ steps.validate.outcome }}" }
        run: |
          git config user.name "runway-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ "$VALIDATE_OUTCOME" = success ]; then git add site; fi
          git diff --cached --quiet || git commit -m "Nightly source check $(date -u +%F)"
          # GITHUB_TOKEN pushes do not create another push workflow.
          # A concurrent rebuild commit must not block the nightly publish: replay this run's commit on top.
          git pull --rebase --autostash -X theirs origin main && git push
      - if: success() && steps.validate.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with: { path: site }
      - if: steps.gate.outputs.go == 'true'
        name: Review digest
        # 2026-09-24: a GitHub API hiccup here must not fail the job and block a deploy whose data already validated.
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The issue is always rewritten from the report committed in this run, so the two can never disagree.
          open_items=$(grep -oE "^OPEN_ITEMS=[0-9]+" data/check_report.md | cut -d= -f2)
          gh label create source-check --color E0A21A --force >/dev/null
          n=$(gh issue list --label source-check --state all --limit 1 --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file data/check_report.md
          else gh issue create --title "Runway: dates to review" --label source-check --body-file data/check_report.md; n=""; fi
          if [ -n "$n" ]; then
            if [ "${open_items:-1}" = "0" ]; then gh issue close "$n" --reason completed || true; else gh issue reopen "$n" || true; fi
          fi
      - if: always() && steps.validate.outcome != 'success'
        name: Fail the run if candidate validation failed (after archiving and reporting)
        run: exit 1

  rebuild:
    # A push (curator edit) rebuilds site/ and commits it, so main's site/ is always the published build.
    needs: [check]
    if: always() && needs.check.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { ref: main, persist-credentials: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - name: Curated data regression checks
        run: python -m unittest discover -s tests
      - name: Daily status regression checks
        run: node tests/test_daily_status.js
      - run: python scripts/build.py && python scripts/validate.py
      - run: |
          git config user.name "runway-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || { git commit -m "Rebuild site $(date -u +%F)"; git pull --rebase --autostash -X theirs origin main && git push; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with: { path: site }

  deploy:
    # One source, one site (curator decision 2026-10-19): GitHub Pages serves appconferencerunway.org from main's site/.
    needs: [check, rebuild]
    if: always() && (needs.check.result == 'success' || needs.rebuild.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy only the validated artifact uploaded by this run, never a later main checkout.
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
