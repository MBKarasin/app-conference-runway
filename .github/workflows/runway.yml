name: Check sources and publish

on:
  schedule:
    - cron: "0 6,7 * * *"        # GitHub schedules run in UTC; the gate below keeps only the run at 2 a.m. New York time (EDT or EST)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}                  # nothing by default; each job asks for only what it needs

concurrency:
  group: runway
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.gate.outputs.go }}
    permissions:
      contents: write            # commit the verification stamps (also keeps the schedule alive)
      issues: write              # open/refresh the review digest
    steps:
      - name: Run only at 2 a.m. New York time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +%H)" != "02" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: true }
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.go == 'true'
        run: pip install --no-cache-dir "pypdf==5.*"
      - if: steps.gate.outputs.go == 'true'
        run: python scripts/build.py && python scripts/check.py && python scripts/build.py && python scripts/validate.py && python scripts/snapshot.py
      - if: steps.gate.outputs.go == 'true'
        name: Commit verification stamps
        run: |
          git config user.name "runway-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verification.json data/check_report.md data/ledger.json data/snapshots site/data/runway.json site/runway.ics
          git diff --cached --quiet || git commit -m "Nightly source check $(date -u +%F)"
          git push
      - if: steps.gate.outputs.go == 'true'
        name: Review digest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if grep -qE "not found [1-9]|Newly failing" data/check_report.md; then
            n=$(gh issue list --label source-check --state open --json number -q '.[0].number')
            gh label create source-check --color E0A21A --force >/dev/null
            if [ -n "$n" ]; then gh issue edit "$n" --body-file data/check_report.md
            else gh issue create --title "Runway: dates to review" --label source-check --body-file data/check_report.md; fi
          fi

  deploy:
    needs: [check]
    if: always() && (needs.check.result == 'skipped' || (needs.check.result == 'success' && needs.check.outputs.go == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - run: python scripts/build.py && python scripts/validate.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
