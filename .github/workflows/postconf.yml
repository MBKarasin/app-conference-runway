name: Post-conference content monitor
# Curator decision 2026-10-21: after each meeting ends, watch for its program, abstracts, posters, speakers,
# recordings, slides and recaps for a year. Signal for how knowledge enters and spreads among APPs.
# Reads site/data/runway.json; writes only data/postconf/. Never changes the public site.
on:
  schedule:
    - cron: "17 9 * * *"         # daily, 5:17 a.m. EDT, after the nightly source check
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: runway                  # shares the nightly job's queue so their commits never collide
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: true }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - run: python monitor/postconf.py
      - name: Commit the inventory (git history is the archive of every run)
        run: |
          git config user.name "runway-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/postconf
          git diff --cached --quiet || git commit -m "Post-conference monitor $(date -u +%F)"
          git pull --rebase --autostash -X theirs origin main && git push
