name: Bootstrap (one-time unpack)
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: "3.12" }
      - name: Unpack bundle, rebuild geo and data
        run: |
          unzip -o runway-bundle.zip -x '.github/*'
          git rm -q runway-bundle.zip
          python scripts/build.py && python scripts/geocode.py && python scripts/build.py && python scripts/validate.py
          rm -rf .geocache
      - name: Commit
        run: |
          git config user.name "runway-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Unpack APP Conference Runway" && git push
